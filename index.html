<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EDH Tracker">
<meta name="application-name" content="EDH Tracker">
<meta name="theme-color" content="#0b0d14">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Life, commander damage and win-rate tracker for Magic: The Gathering Commander games.">
<title>Commander Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabbar">
    <button data-act="tab" data-tab="play"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.3C.9 7.8 3.2 4 6.9 4c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.7 0 6 3.8 4.5 7.2-2.1 4.7-9.6 9.3-9.6 9.3z"/></svg><span>Play</span></button>
    <button data-act="tab" data-tab="commanders"><svg viewBox="0 0 24 24"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="M9 11.5l2 2 4-4"/></svg><span>Commanders</span></button>
    <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></button>
    <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
    <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></button>
  </nav>
</div>
<div id="game" hidden></div>
<!-- Login screen. Backgrounds: img/login-phone.jpg (phones) and img/login-tablet.jpg (>= 768px wide), see styles.css -->
<div id="login" hidden>
  <div class="login-bg"></div>
  <div class="login-shade"></div>
  <div class="login-inner"><div class="login-card">
    <div class="login-brand">
      <img class="login-logo" src="icons/icon-192.png" alt="" width="96" height="96">
      <h1>Commander Tracker</h1>
      <p class="login-tag">Life, commander damage and stats for your playgroup.</p>
    </div>
    <div class="login-bottom">
      <div class="login-invite" hidden></div>
      <div class="login-actions">
        <button class="btn google-btn big block" data-login="google"></button>
        <div class="form-error center" data-role="lerr"></div>
        <button class="link-btn login-other" data-login="other">Other options</button>
        <button class="btn login-local block" data-login="local">Play without an account</button>
      </div>
      <div class="login-busy" hidden><span class="spinner"></span> Signing you in…</div>
    </div>
  </div></div>
</div>
<div id="overlay-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous" defer></script>
<script src="cloud.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
